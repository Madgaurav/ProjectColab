<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 180" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faedd6" />
      <stop offset="50%" stop-color="#f1dfc0" />
      <stop offset="100%" stop-color="#d4af78" />
    </linearGradient>
    <linearGradient id="goldGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#faedd6" />
      <stop offset="60%" stop-color="#f1dfc0" />
      <stop offset="100%" stop-color="#c89d5d" />
    </linearGradient>
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    @import url("https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800&display=swap");
    .orbit {
      transform-origin: 90px 90px;
      fill: none;
      stroke-width: 4.8;
      stroke-linecap: round;
    }
    .orbit-1 {
      stroke: url(#goldGrad1);
      animation: spin1 14s linear infinite;
    }
    .orbit-2 {
      stroke: url(#goldGrad2);
      animation: spin2 18s linear infinite reverse;
    }
    .orbit-3 {
      stroke: url(#goldGrad1);
      animation: spin3 22s linear infinite;
    }
    .core {
      fill: #f1dfc0;
      transform-origin: 90px 90px;
      animation: pulseCore 3.5s ease-in-out infinite;
      filter: url(#coreGlow);
    }
    .brand-title {
      font-family: Montserrat, -apple-system, sans-serif;
      font-weight: 700;
      font-size: 58px;
      letter-spacing: -0.04em;
    }
    .brand-tagline {
      font-family: Montserrat, -apple-system, sans-serif;
      font-weight: 600;
      font-size: 14px;
      letter-spacing: 0.38em;
      fill: #e8e8e8;
    }
    @keyframes spin1 {
      0% { transform: rotate(-35deg); }
      100% { transform: rotate(325deg); }
    }
    @keyframes spin2 {
      0% { transform: rotate(42deg); }
      100% { transform: rotate(402deg); }
    }
    @keyframes spin3 {
      0% { transform: rotate(84deg); }
      100% { transform: rotate(444deg); }
    }
    @keyframes pulseCore {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.15); opacity: 1; }
    }
  </style>

  <!-- Symbol Container (centered around 90, 90) -->
  <g id="symbol">
    <g class="orbit orbit-1">
      <ellipse cx="90" cy="90" rx="64" ry="32" />
      <circle cx="154" cy="90" r="2.8" fill="#ffffff" opacity="0.8" />
    </g>
    <g class="orbit orbit-2">
      <ellipse cx="90" cy="90" rx="64" ry="32" />
      <circle cx="26" cy="90" r="2.4" fill="#ffffff" opacity="0.8" />
    </g>
    <g class="orbit orbit-3">
      <ellipse cx="90" cy="90" rx="62" ry="30" />
      <circle cx="90" cy="60" r="2.6" fill="#ffffff" opacity="0.8" />
    </g>
    <circle class="core" cx="90" cy="90" r="13" />
  </g>

  <!-- Typography -->
  <g id="text-lockup" transform="translate(195, 0)">
    <text x="0" y="98" class="brand-title">
      <tspan fill="#ffffff">Project</tspan><tspan fill="#f1dfc0">Collab</tspan>
    </text>
    <text x="4" y="132" class="brand-tagline">FIND YOUR COLLEGE TEAMMATES</text>
  </g>
</svg>