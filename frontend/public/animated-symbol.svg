<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faedd6" />
      <stop offset="50%" stop-color="#f1dfc0" />
      <stop offset="100%" stop-color="#d4af78" />
    </linearGradient>
    <linearGradient id="goldGrad2" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#faedd6" />
      <stop offset="60%" stop-color="#f1dfc0" />
      <stop offset="100%" stop-color="#c89d5d" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="coreGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .orbit {
      transform-origin: 100px 100px;
      fill: none;
      stroke-width: 4.8;
      stroke-linecap: round;
    }
    .orbit-1 {
      stroke: url(#goldGrad1);
      animation: spin1 14s linear infinite;
    }
    .orbit-2 {
      stroke: url(#goldGrad2);
      animation: spin2 18s linear infinite reverse;
    }
    .orbit-3 {
      stroke: url(#goldGrad1);
      animation: spin3 22s linear infinite;
    }
    .core {
      fill: #f1dfc0;
      transform-origin: 100px 100px;
      animation: pulseCore 3.5s ease-in-out infinite;
      filter: url(#coreGlow);
    }
    .node-particle {
      fill: #ffffff;
      filter: url(#glow);
    }
    @keyframes spin1 {
      0% { transform: rotate(-35deg) scale(1); }
      50% { transform: rotate(145deg) scale(1.03); }
      100% { transform: rotate(325deg) scale(1); }
    }
    @keyframes spin2 {
      0% { transform: rotate(42deg) scale(1); }
      50% { transform: rotate(222deg) scale(0.97); }
      100% { transform: rotate(402deg) scale(1); }
    }
    @keyframes spin3 {
      0% { transform: rotate(84deg) scale(1); }
      50% { transform: rotate(264deg) scale(1.02); }
      100% { transform: rotate(444deg) scale(1); }
    }
    @keyframes pulseCore {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.15); opacity: 1; }
    }
  </style>

  <!-- Background Orbit 1 -->
  <g class="orbit orbit-1">
    <ellipse cx="100" cy="100" rx="66" ry="32" />
    <circle cx="166" cy="100" r="3" class="node-particle" opacity="0.85" />
  </g>

  <!-- Background Orbit 2 -->
  <g class="orbit orbit-2">
    <ellipse cx="100" cy="100" rx="66" ry="32" />
    <circle cx="34" cy="100" r="2.6" class="node-particle" opacity="0.8" />
  </g>

  <!-- Background Orbit 3 -->
  <g class="orbit orbit-3">
    <ellipse cx="100" cy="100" rx="64" ry="30" />
    <circle cx="100" cy="70" r="2.8" class="node-particle" opacity="0.8" />
  </g>

  <!-- Central Core / Collaboration Nucleus -->
  <circle class="core" cx="100" cy="100" r="13" />
</svg>